    <path d="M148 36h64l-6 92a11 11 0 0 1-11 10h-30a11 11 0 0 1-11-10L148 36Z" fill="#f7f1e4" stroke="#c9bfa8" stroke-width="3"/>
    <path d="M156 58h48l-4 64a7 7 0 0 1-7 6h-26a7 7 0 0 1-7-6L156 58Z" fill="#e2a04a" opacity=".75"/>
    <text x="32" y="176" fill="#1c1c1e" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700">5. Light orange</text>
    <text x="32" y="210" fill="#8e8e93" font-family="Helvetica, Arial, sans-serif" font-size="18">Almost clear</text>
