<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <rect width="1200" height="860" fill="#f2f2f7"/>
  <text x="56" y="72" fill="#8e8e93" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="1">PREPPATH - PREP CHECK</text>
  <text x="56" y="118" fill="#1c1c1e" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="700">Stool scale</text>
  <text x="56" y="156" fill="#3a3a3c" font-family="Helvetica, Arial, sans-serif" font-size="22">Adapted from TTSH 6-point scale. Aim for stage 6 before you leave.</text>

  <!-- 1 -->
  <g transform="translate(40 196)">
    <rect width="360" height="280" rx="28" fill="#ffffff"/>
    <path d="M148 36h64l-6 92a11 11 0 0 1-11 10h-30a11 11 0 0 1-11-10L148 36Z" fill="#f7f1e4" stroke="#c9bfa8" stroke-width="3"/>
    <path d="M155 46h50l-5 76a8 8 0 0 1-8 7h-24a8 8 0 0 1-8-7L155 46Z" fill="#5c3a24"/>
    <text x="32" y="176" fill="#1c1c1e" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700">1. Solid lumps</text>
    <text x="32" y="210" fill="#8e8e93" font-family="Helvetica, Arial, sans-serif" font-size="18">Dark, thick, formed</text>
    <rect x="32" y="228" width="108" height="28" rx="14" fill="#ffeceb"/>
    <text x="86" y="247" text-anchor="middle" fill="#ff3b30" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700">NOT READY</text>
  </g>
  <!-- 2 -->
  <g transform="translate(420 196)">
    <rect width="360" height="280" rx="28" fill="#ffffff"/>
    <path d="M148 36h64l-6 92a11 11 0 0 1-11 10h-30a11 11 0 0 1-11-10L148 36Z" fill="#f7f1e4" stroke="#c9bfa8" stroke-width="3"/>
    <path d="M155 46h50l-5 76a8 8 0 0 1-8 7h-24a8 8 0 0 1-8-7L155 46Z" fill="#7a4a28"/>
    <text x="32" y="176" fill="#1c1c1e" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700">2. Soft blobs</text>
    <text x="32" y="210" fill="#8e8e93" font-family="Helvetica, Arial, sans-serif" font-size="18">Brown, still has stool</text>
    <rect x="32" y="228" width="108" height="28" rx="14" fill="#ffeceb"/>
    <text x="86" y="247" text-anchor="middle" fill="#ff3b30" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700">NOT READY</text>
  </g>
  <!-- 3 -->
  <g transform="translate(800 196)">
    <rect width="360" height="280" rx="28" fill="#ffffff"/>
    <path d="M148 36h64l-6 92a11 11 0 0 1-11 10h-30a11 11 0 0 1-11-10L148 36Z" fill="#f7f1e4" stroke="#c9bfa8" stroke-width="3"/>
    <path d="M155 46h50l-5 76a8 8 0 0 1-8 7h-24a8 8 0 0 1-8-7L155 46Z" fill="#8a5a2a"/>
    <text x="32" y="176" fill="#1c1c1e" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700">3. Cloudy brown</text>
    <text x="32" y="210" fill="#8e8e93" font-family="Helvetica, Arial, sans-serif" font-size="18">Dark liquid + particles</text>
    <rect x="32" y="228" width="108" height="28" rx="14" fill="#ffeceb"/>
    <text x="86" y="247" text-anchor="middle" fill="#ff3b30" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700">NOT READY</text>
  </g>
  <!-- 4 -->
  <g transform="translate(40 500)">
    <rect width="360" height="280" rx="28" fill="#ffffff"/>
    <path d="M148 36h64l-6 92a11 11 0 0 1-11 10h-30a11 11 0 0 1-11-10L148 36Z" fill="#f7f1e4" stroke="#c9bfa8" stroke-width="3"/>
    <path d="M155 46h50l-5 76a8 8 0 0 1-8 7h-24a8 8 0 0 1-8-7L155 46Z" fill="#c47a2b"/>
    <text x="32" y="176" fill="#1c1c1e" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700">4. Dark liquid</text>
    <text x="32" y="210" fill="#8e8e93" font-family="Helvetica, Arial, sans-serif" font-size="18">Dark orange, semi-clear</text>
    <rect x="32" y="228" width="108" height="28" rx="14" fill="#ffeceb"/>
    <text x="86" y="247" text-anchor="middle" fill="#ff3b30" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700">NOT READY</text>
  </g>
  <!-- 5 -->
